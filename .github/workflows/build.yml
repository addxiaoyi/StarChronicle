name: Maven verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test with the pinned Maven Wrapper
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean verify 2>&1 | tee verify-build.log
      - name: Verify artifact fingerprints and generate the report
        run: python3 tools/verification_report.py verify-build.log
      - name: Package source, artifacts and actual test reports
        run: |
          python3 tools/package-delivery.py
          python3 tools/verify-delivery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-reports
          path: |
            target/*.jar
            target/*-delivery.zip
            target/surefire-reports/
            target/site/jacoco/
            docs/TEST-REPORT.md
            verify-build.log
